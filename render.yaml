services:
  - type: web
    name: artha-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    disk:
      name: artha-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: moonshotai/kimi-k2.6
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: MAX_CONTEXT_TOKENS
        value: "200000"
      - key: MAX_OUTPUT_TOKENS
        value: "4096"
      - key: LLM_TEMPERATURE
        value: "0.2"
      - key: BM25_TOP_K
        value: "15"
      - key: BM25_INDEX_DIR
        value: /data/indexes
      - key: CORPUS_DIR
        value: /data/corpus
      - key: DATABASE_URL
        fromDatabase:
          name: artha-postgres
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: artha-postgres
          property: connectionString
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: REDIS_URL
        fromService:
          name: artha-redis
          type: redis
          property: connectionString
      - key: CACHE_TTL_SECONDS
        value: "3600"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: APP_TITLE
        value: ARTHA
      - key: APP_VERSION
        value: 1.0.0

databases:
  - name: artha-postgres
    databaseName: artha
    user: artha
    plan: free

  - name: artha-redis
    plan: free
    ipAllowList: []
